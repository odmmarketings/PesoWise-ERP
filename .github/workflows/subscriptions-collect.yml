# PesoWise — auto-collect due subscriptions into Book Keeping, sa CLOUD (kahit patay ang PC).
# Walang browser/Chrome na kailangan dito — Supabase reads/writes lang.
# Cron ay nasa UTC; PH = UTC+8.
name: Subscriptions Collect

on:
  schedule:
    - cron: "5 0 * * *"    # 8:05 AM PHT — araw-araw
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: read                # least privilege — basa lang ng code

concurrency:
  group: subscriptions-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect due subscriptions → Book Keeping
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/subscriptions-bill.mjs
