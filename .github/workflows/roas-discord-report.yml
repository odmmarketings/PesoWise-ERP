# PesoWise — Page ROAS report → Discord, tumatakbo sa CLOUD (kahit patay ang PC).
# Cron ay nasa UTC; PH = UTC+8.
name: ROAS Discord Report

# TIMING: hindi eksakto ang GitHub Actions scheduler — pinakamatindi ang pila sa
# TUKTOK ng oras (:00), kaya doon pinakamalaki ang delay. Kaya:
#   1) off-peak na minuto at ~7 minutong maaga ang pagpapaputok, para tumapat sa slot;
#   2) sini-snap ng script ang caption sa nakatakdang slot (tingnan ang SLOTS_MIN sa
#      scripts/roas-discord-report.mjs) — kaya "6:00PM SALES REPORT" pa rin ang tatak
#      kahit 6:12PM nag-umpisa ang runner, at may "data as of" kapag na-delay.
# Baguhin ang SLOTS_MIN kasabay ng cron dito.
on:
  schedule:
    - cron: "53 0,3,6,9,12 * * *"   # 8:53, 11:53, 2:53, 5:53, 8:53 PM PHT → 9AM/12PM/3PM/6PM/9PM slots
    - cron: "52 15 * * *"           # 11:52PM PHT → 11:50PM end-of-day slot
  workflow_dispatch:                # manual "Run workflow" button

permissions:
  contents: read                    # least privilege — basa lang ng code

concurrency:
  group: roas-discord-report        # hindi mag-o-overlap ang dalawang run
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send ROAS report to Discord
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/roas-discord-report.mjs --window today
